services:
  - type: web
    name: xynapse
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: XYNAPSE_ENV
        value: production
      - key: ALERT_COOLDOWN_SECONDS
        value: "10"
      - key: DETECTION_CONFIDENCE
        value: "0.50"
